version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /bin
    - /sbin
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /app
    - /sandbox
    - /tmp
    - /dev/null
    - /home
    - /run
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  dns_udp:
    name: dns-udp
    endpoints:
      - host: "10.43.0.10"
        port: 53
        protocol: udp
        access: full
    binaries:
      - path: /usr/local/bin/python
      - path: /usr/local/bin/python3.12
  dns_tcp:
    name: dns-tcp
    endpoints:
      - host: "10.43.0.10"
        port: 53
        protocol: tcp
        access: full
    binaries:
      - path: /usr/local/bin/python
      - path: /usr/local/bin/python3.12
  youtube_api:
    name: youtube-api
    endpoints:
      - host: youtube.googleapis.com
        port: 443
        protocol: rest
        tls: true
        enforcement: enforce
        access: read-only
      - host: www.googleapis.com
        port: 443
        protocol: rest
        tls: true
        enforcement: enforce
        access: read-only
      - host: youtube.com
        port: 443
        protocol: rest
        tls: true
        access: read-only
    binaries:
      - path: /usr/local/bin/python
      - path: /usr/local/bin/python3.12
  local_llm:
    name: local-llm
    endpoints:
      - host: host.docker.internal
        port: 9000
      - host: "172.22.0.1"
        port: 9000
    binaries:
      - path: /usr/local/bin/python
      - path: /usr/local/bin/python3.12
  telegram:
    name: telegram
    endpoints:
      - host: api.telegram.org
        port: 443
        protocol: rest
        tls: true
        access: read-write
    binaries:
      - path: /usr/local/bin/python
      - path: /usr/local/bin/python3.12
